name: CI

# Runs on every push to every branch, and every PR:
#   - TypeScript build clean
#   - Format clean (prettier --check)
#   - Lint (errors fail)
#   - Architecture gate: tsc, eslint, and the knip dead-code ratchet
#   - Full vitest suite
#   - The false-done eval: 22 recorded agent claims, graded by code
#   - v2/ (the 2.0 package): its end-to-end suite
#
# Why '**' and not a branch allowlist: a branch you forgot to list is exactly the branch that needs the gate.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Tests (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '24']
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install (frozen lockfile)
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (warnings allowed; errors fail)
        run: npm run lint -- --max-warnings 100

      - name: Architecture gate (knip ratchet)
        run: node scripts/knip-gate.mjs

      - name: Vitest, full suite
        run: npx vitest run --reporter=default

      # The eval re-runs `codehere check` on recorded claims, which calls node and npm (setup-node
      # above), pytest and go. A task whose runner is missing grades grey, so install each one.
      # setup-python gives pip a Python it may install into: the runner's Homebrew Python on macOS
      # refuses (PEP 668). macOS runners have no Go on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install pytest for the eval
        run: python3 -m pip install pytest

      - name: False-done eval
        run: node eval/false-done.mjs

  v2:
    # v2/ is plain Node with no dependencies, so its end-to-end suite is the whole check.
    name: v2 e2e (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '24']
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: End-to-end suite
        run: npm test
