# .github/workflows/codehere.yml: drop-in for a repo that wants every pull request's tests re-run
# independently, with one receipt comment. Replace OWNER/REPO with where this action is published.
name: codehere
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch must be in the clone for --base
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci # or your own install step: the tests must be runnable
      - uses: OWNER/REPO/action@main
